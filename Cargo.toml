[package]
name = "solana-onchain-arbitrage-bot"
version = "0.1.0"
edition = "2021"
description = "A simple Solana onchain arbitrage bot"
repository = "https://github.com/cetipo/solana-onchain-arbitrage-bot"
license = "MIT"

[lib]
name = "solana_onchain_arbitrage_bot"
path = "src/lib.rs"

[features]
default = []
geyser = ["yellowstone-grpc-client", "yellowstone-grpc-proto"]

[[bin]]
name = "flashx_direct_executor"
path = "src/bin/flashx_direct_executor.rs"
required-features = ["geyser"]

[[bin]]
name = "pools_by_mint_updater"
path = "src/bin/pools_by_mint_updater.rs"
required-features = ["geyser"]

[[bin]]
name = "rabbitstream_probe"
path = "src/bin/rabbitstream_probe.rs"
required-features = ["geyser"]

[[bin]]
name = "nonce_setup"
path = "src/bin/nonce_setup.rs"

[[bin]]
name = "wallet_probe"
path = "src/bin/wallet_probe.rs"
required-features = ["geyser"]

[dependencies]
# Core Solana dependencies
solana-sdk = "1.17"
solana-client = "1.17"
solana-program = "1.17"
solana-account-decoder = "1.17"
solana-transaction-status = "1.17"

# SPL token support
spl-token = { version = "4.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "1.0.5", features = [
    "no-entrypoint",
] }

# Serialization/deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.5"

# Async runtime
tokio = { version = "1.32", features = ["full"] }
futures = "0.3"
yellowstone-grpc-client = { version = "1.15.4", optional = true }
yellowstone-grpc-proto = { version = "1.14.2", optional = true }

# Utilities
anyhow = "1.0"
thiserror = "1.0"
rand = "0.8"
bs58 = "0.4"
borsh = "0.10.3"
dashmap = "5.5"
bytemuck = { version = "1.16.1", features = ["derive"] }
base64 = "0.21"
bincode = "1.3"
reqwest = { version = "0.11", features = ["json"] }

# Command line argument parsing
clap = "3.2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

meteora-damm-cpi = { path = "lib/meteora-damm", features = ["no-entrypoint"] }
meteora-vault-cpi = { path = "lib/meteora-vault", features = ["no-entrypoint"] }
